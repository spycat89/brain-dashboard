<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ana · Brain</title>
<style>
  :root {
    --bg: #f7f8fa;
    --surface: #ffffff;
    --surface-2: #fbfbfc;
    --border: #e6e8eb;
    --border-strong: #d5d9de;
    --ink: #1a1d21;
    --dim: #565e66;
    --faint: #8a929b;
    --accent: #e0784e;
    --accent-ink: #b85c33;
    --accent-soft: #fdf1ea;
    --radius: 10px;
    --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "Cascadia Code", Consolas, monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:var(--font); font-size:14px; line-height:1.55; overflow:hidden; }
  ::selection { background:rgba(224,120,78,.2); }
  .app { display:flex; height:100vh; }

  /* ===== Sidebar ===== */
  .side { width:236px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; }
  .brand { display:flex; align-items:center; gap:10px; padding:20px 18px 16px; }
  .mark { width:26px; height:26px; border-radius:7px; background:linear-gradient(135deg,#e0784e,#c95f37); display:grid; place-items:center; color:#fff; font-weight:700; font-size:13px; box-shadow:0 2px 6px rgba(224,120,78,.3); }
  .brand .nm { font-weight:650; font-size:14px; letter-spacing:.1px; }
  .brand .sb { font-size:11px; color:var(--faint); }
  .nav { padding:6px 10px 10px; flex:1; overflow-y:auto; }
  .nav .grp, .nav .nav-group { font-size:10.5px; text-transform:uppercase; letter-spacing:1.3px; color:var(--faint); padding:14px 10px 5px; }
  .nav a { display:flex; align-items:center; gap:9px; padding:7px 10px; border-radius:7px; color:var(--dim); font-size:13.5px; text-decoration:none; margin-bottom:1px; font-weight:450; }
  .nav a:hover { background:#f3f4f6; color:var(--ink); }
  .nav a.on { background:var(--accent-soft); color:var(--accent-ink); font-weight:600; }
  .nav a .cnt { margin-left:auto; font-size:11px; color:var(--faint); font-family:var(--mono); }
  .nav a.on .cnt { color:var(--accent-ink); }
  .side-foot { border-top:1px solid var(--border); padding:12px 16px; font-size:11.5px; color:var(--faint); display:flex; align-items:center; gap:7px; }
  .live { width:7px; height:7px; border-radius:50%; background:#3daf6f; }

  /* ===== Main ===== */
  .main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .bar { height:54px; border-bottom:1px solid var(--border); background:var(--surface); display:flex; align-items:center; padding:0 26px; gap:10px; }
  .bar h1 { font-size:15px; font-weight:600; }
  .bar .crumb { color:var(--faint); font-size:12.5px; }
  .bar .grow { flex:1; }
  .search { display:flex; align-items:center; gap:7px; background:var(--bg); border:1px solid var(--border); border-radius:7px; padding:5px 12px; width:220px; color:var(--faint); font-size:12px; }
  .search input { border:none; outline:none; background:none; font-size:13px; width:100%; color:var(--ink); font-family:var(--font); }
  .search input::placeholder { color:var(--faint); }

  .body { flex:1; overflow-y:auto; padding:30px 34px 80px; }
  .wrap { max-width:1280px; margin:0 auto; padding:0 8px; }

  /* ===== Dokumen (Brain home) ===== */
  .pt { font-size:22px; font-weight:700; letter-spacing:-.3px; }
  .pd { color:var(--dim); font-size:13.5px; margin:5px 0 24px; }
  .doclist { display:flex; flex-direction:column; gap:2px; }
  .doc { display:flex; align-items:center; gap:14px; padding:15px 14px; border:1px solid transparent; border-radius:9px; cursor:pointer; transition:background .12s; }
  .doc:hover { background:var(--surface); border-color:var(--border); box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .doc .ic { width:38px; height:38px; border-radius:9px; display:grid; place-items:center; font-size:15px; flex-shrink:0; }
  .ic.soul { background:#fdf0e6; } .ic.memory { background:#e9f3ea; } .ic.user { background:#e8f0fb; }
  .doc .nm { font-size:14.5px; font-weight:600; }
  .doc .ds { font-size:12.5px; color:var(--dim); }
  .doc .meta { margin-left:auto; text-align:right; color:var(--faint); font-size:11px; font-family:var(--mono); flex-shrink:0; }
  .doc .arr { color:#c3c9cf; font-size:16px; margin-left:4px; }

  .h2 { font-size:16px; font-weight:650; margin:30px 0 4px; }
  .h2sub { color:var(--dim); font-size:13px; margin-bottom:12px; }

  /* ===== Skills ===== */
  .skgroup { margin-bottom:18px; }
  .skhead { font-size:11px; text-transform:uppercase; letter-spacing:1.1px; color:var(--faint); padding:0 8px; margin-bottom:2px; }
  .sk { display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:7px; cursor:pointer; }
  .sk:hover { background:var(--surface); }
  .sk .sn { font-family:var(--mono); font-size:12.5px; width:185px; flex-shrink:0; font-weight:500; }
  .sk .sd { color:var(--dim); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .none { color:var(--faint); text-align:center; padding:24px; font-size:13px; }

  /* ===== Chat ===== */
  .chatwrap { max-width:760px; margin:0 auto; display:flex; flex-direction:column; height:calc(100vh - 150px); }
  .chatbox { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:14px; padding:6px 4px 16px; }
  .bubble { max-width:85%; padding:10px 15px; border-radius:14px; font-size:13.5px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
  .bubble.user { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
  .bubble.ana { align-self:flex-start; background:var(--surface); border:1px solid var(--border); border-bottom-left-radius:4px; }
  .bubble .who { font-size:10.5px; color:var(--faint); margin-bottom:3px; font-weight:600; text-transform:uppercase; letter-spacing:.6px; }
  .bubble.ana .who { color:var(--accent-ink); }
  .bubble.typing { color:var(--faint); font-style:italic; }
  .chatinput { display:flex; gap:8px; padding:10px 0 0; border-top:1px solid var(--border); }
  .chatinput textarea { flex:1; resize:none; border:1px solid var(--border); border-radius:10px; background:var(--surface); color:var(--ink); font-family:var(--font); font-size:13.5px; padding:10px 14px; outline:none; min-height:44px; max-height:120px; }
  .chatinput textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(224,120,78,.12); }
  .chatinput button { border:none; border-radius:10px; background:var(--accent); color:#fff; font-size:13px; font-weight:600; padding:0 20px; cursor:pointer; font-family:var(--font); }
  .chatinput button:hover { background:#c95f37; }
  .chatinput button:disabled { opacity:.5; cursor:wait; }

  /* ===== Performance Marketing ===== */
  .pmkpi { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; }
  .pmkpi .v { font-size:24px; font-weight:800; letter-spacing:-0.5px; }
  .pmkpi .l { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; margin-top:2px; }
  .pmkpi .d { font-size:11px; margin-top:6px; padding:2px 8px; border-radius:20px; display:inline-block; }
  .up { color:#047857; background:#d1fae5; } .down { color:#b91c1c; background:#fee2e2; } .flat { color:#6b7280; background:#f3f4f6; }
  .pmsec { margin-top:22px; }
  .pmsec h3 { font-size:15px; font-weight:800; margin-bottom:4px; }
  .pmsec .sub { font-size:11.5px; color:var(--faint); margin-bottom:12px; }
  .funnel { display:flex; flex-direction:column; gap:0; }
  .fstage { position:relative; border-radius:10px; padding:12px 18px; margin-bottom:2px;
    background:var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .fstage .fn { font-size:13px; font-weight:700; }
  .fstage .fv { font-size:16px; font-weight:800; }
  .fstage .fc { font-size:11px; color:var(--dim); }
  .fstage .fd { font-size:11px; color:var(--faint); text-align:right; margin-left:10px; }
  .fconn { text-align:center; color:var(--faint); font-size:14px; line-height:1; padding:2px 0; }
  .na-tag { color:#9ca3af; font-style:italic; font-size:12px; }
  .alert-red { border-left:4px solid #dc2626; } .alert-yellow { border-left:4px solid #d97706; } .alert-green { border-left:4px solid #059669; }
  .insight-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px; }
  .sortbtn { border:1px solid var(--border); background:var(--surface); color:var(--dim); border-radius:7px; padding:3px 10px; font-size:11.5px; cursor:pointer; margin-right:6px; font-family:var(--font); }
  .sortbtn.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  /* ===== Meta Ads ===== */
  .statgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin:18px 0 26px; }
  .statcard { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px; }
  .statcard .lb { font-size:11px; color:var(--faint); text-transform:uppercase; letter-spacing:.8px; }
  .statcard .vl { font-size:22px; font-weight:700; margin-top:5px; letter-spacing:-.3px; }
  .statcard .sb { font-size:11.5px; color:var(--dim); margin-top:2px; }
  .statcard.accent { background:var(--accent-soft); border-color:rgba(224,120,78,.3); }
  .tablewrap { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-bottom:14px; }
  .tablewrap .thead { padding:13px 18px; border-bottom:1px solid var(--border); font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:8px; }
  .tablewrap .thead .grow { flex:1; }
  .tablewrap .badge { font-size:10.5px; padding:2px 8px; border-radius:20px; font-weight:600; }
  .badge.active { background:rgba(61,175,111,.15); color:#2d8f57; }
  .badge.paused { background:rgba(200,150,80,.15); color:#a67c2d; }
  table.mt { width:100%; border-collapse:collapse; font-size:12.5px; }
  table.mt th { text-align:left; padding:9px 18px; font-size:10.5px; text-transform:uppercase; letter-spacing:.7px; color:var(--faint); border-bottom:1px solid var(--border); background:var(--surface-2); font-weight:600; }
  table.mt td { padding:11px 18px; border-bottom:1px solid #f0f1f3; }
  table.mt tr:last-child td { border-bottom:none; }
  table.mt tr.click { cursor:pointer; }
  table.mt tr.click:hover td { background:#faf7f4; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .nm2 { font-weight:600; font-size:12.5px; }
  .sub2 { color:var(--faint); font-size:11px; }
  .drill { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 16px; margin-bottom:10px; cursor:pointer; }
  .drill:hover { border-color:var(--accent); }
  .drill .dn { font-weight:600; font-size:13px; }
  .drill .dm { color:var(--dim); font-size:12px; margin-top:2px; display:flex; gap:14px; flex-wrap:wrap; }
  .refresh { border:1px solid var(--border); background:var(--surface); color:var(--dim); border-radius:7px; padding:4px 12px; font-size:12px; cursor:pointer; font-family:var(--font); }
  .refresh:hover { color:var(--ink); border-color:var(--border-strong); }
  .dte { border:1px solid var(--border); border-radius:7px; padding:5px 9px; font-size:12.5px; background:var(--surface); color:var(--ink); font-family:var(--font); }
  .muted { color:var(--faint); font-size:12px; }

  /* ===== Detail ===== */
  .back { display:inline-flex; align-items:center; gap:6px; color:var(--dim); font-size:13px; cursor:pointer; padding:4px 8px; border-radius:6px; margin-bottom:14px; }
  .back:hover { background:var(--border); color:var(--ink); }
  .dt { font-size:20px; font-weight:700; letter-spacing:-.2px; }
  .ds2 { font-family:var(--mono); font-size:11.5px; color:var(--faint); margin:3px 0 16px; }
  pre.code { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:20px 22px; font-family:var(--mono); font-size:12.5px; line-height:1.7; white-space:pre-wrap; word-break:break-word; overflow-x:auto; box-shadow:0 1px 2px rgba(0,0,0,.03); }
  pre.code::before { content:attr(data-file); display:block; font-family:var(--font); font-size:11px; color:var(--faint); border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:14px; }

  /* ===== Mascot — light ===== */
  .mascot { position:fixed; z-index:999; right:24px; bottom:24px; width:62px; height:62px; cursor:grab; user-select:none; }
  .mascot:active { cursor:grabbing; }
  .mascot .head { position:absolute; inset:0; border-radius:50%; background:radial-gradient(circle at 35% 28%, #fff, #f1e8df); border:1.5px solid #e5d8cc; box-shadow:0 8px 22px rgba(120,90,60,.18); overflow:hidden; display:grid; place-items:center; }
  .mascot .hair { position:absolute; top:1px; left:50%; transform:translateX(-50%); width:46px; height:26px; background:radial-gradient(ellipse at 50% 20%, #4a3a2e, #33261c); border-radius:50% 50% 42% 42%; }
  .mascot .eyes { position:absolute; top:25px; left:50%; transform:translateX(-50%); display:flex; gap:12px; }
  .mascot .eye { width:4px; height:5px; background:#33261c; border-radius:50%; }
  .mascot .smile { position:absolute; top:36px; left:50%; transform:translateX(-50%); width:10px; height:5px; border-bottom:1.6px solid #33261c; border-radius:0 0 9px 9px; }
  .mascot .ring { position:absolute; right:-3px; bottom:-3px; width:19px; height:19px; border-radius:50%; border:2.5px solid #fff; background:#3daf6f; display:grid; place-items:center; font-size:8px; color:#fff; }
  .mascot .tip { position:absolute; bottom:70px; right:0; background:#2a2e33; color:#fff; border-radius:8px 8px 2px 8px; padding:5px 10px; font-size:11px; white-space:nowrap; opacity:0; transform:translateY(4px); transition:all .22s; pointer-events:none; }
  .mascot:hover .tip { opacity:1; transform:translateY(0); }
  .mascot.busy .head { animation:bob 1.3s ease-in-out infinite; }
  .mascot.busy .ring { background:#e0784e; }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(0)} 25%{transform:translateY(-3px) rotate(-5deg)} 75%{transform:translateY(0) rotate(4deg)} }

  ::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:#d8dce0;border-radius:9px;border:2px solid var(--bg)}::-webkit-scrollbar-thumb:hover{background:#c2c8ce}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="mark">A</div><div><div class="nm">Ana</div><div class="sb">workspace</div></div></div>
    <nav class="nav" id="nav">
      <div class="nav-group">Workspace</div>
      <a href="#brain" data-v="docs" class="on"><span>Brain</span><span class="cnt" id="navBrain">3</span></a>
      <a href="#chat" data-v="chat"><span>Chat</span><span class="cnt" id="navChatLive" style="display:none">●</span></a>
      <a href="#meta" data-v="meta"><span>Meta Ads</span></a>
      <a href="#pm" data-v="pm"><span>Performance Mktg</span></a>
      <div class="grp" style="display:none"></div>
      <a href="#skills" data-v="skills"><span>Skills</span><span class="cnt" id="navSkills">0</span></a>
      <div class="grp">Nanti</div>
      <a href="#cron" data-v="soon"><span>Cron</span></a>
      <a href="#tasks" data-v="soon"><span>Tasks</span></a>
      <a href="#clients" data-v="soon"><span>Clients</span></a>
    </nav>
    <div class="side-foot"><span class="live"></span><span id="liveTxt">Ana online</span></div>
  </aside>

  <div class="main">
    <div class="bar">
      <h1 id="t1">Brain</h1><span class="crumb" id="t2"></span>
      <div class="grow"></div>
      <div class="search" id="sw" style="display:none"><span>⌕</span><input id="q" placeholder="Cari skill…"></div>
    </div>
    <div class="body"><div class="wrap" id="content"><div style="color:var(--faint);padding:40px;text-align:center">Memuat…</div></div></div>
  </div>
</div>

<div class="mascot" id="mascot">
  <div class="head"><div class="hair"></div><div class="eyes"><span class="eye"></span><span class="eye"></span></div><div class="smile"></div></div>
  <div class="ring" id="mr">✓</div>
  <div class="tip" id="mt">Ana</div>
</div>

<script>
let B=null,S=null;
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'), get=async u=>(await fetch(u)).json();

/* nav */
document.querySelectorAll('#nav a[data-v]').forEach(a=>a.addEventListener('click',e=>{
  e.preventDefault();
  document.querySelectorAll('#nav a').forEach(x=>x.classList.remove('on'));
  a.classList.add('on');
  ({docs:viewDocs,skills:viewSkills,soon:viewSoon,chat:viewChat,meta:viewMeta,pm:viewPM})[a.dataset.v]();
}));
function setNav(v){document.querySelectorAll('#nav a').forEach(x=>x.classList.toggle('on',x.dataset.v===v));}

/* ===== views ===== */
function viewDocs(){
  setNav('docs'); $('t1').textContent='Brain'; $('t2').textContent='';
  $('sw').style.display='none';
  let h='<div class="pt">Brain</div><div class="pd">Dokumen teras — identiti, memori & profil Ana.</div><div class="doclist">';
  for(const f of B.files){
    const ic=f.id==='soul'?'◈':f.id==='memory'?'≡':'◉';
    h+=`<div class="doc" onclick="openDoc('${f.id}')"><div class="ic ${f.id}">${ic}</div>
      <div><div class="nm">${esc(f.name)}</div><div class="ds">${esc(f.desc)}</div></div>
      <div class="meta">${f.content.split('\n').length} baris<br>${(f.chars/1000).toFixed(1)} KB</div><span class="arr">›</span></div>`;
  }
  h+='</div><div class="h2">Skills</div><div class="h2sub">${S.total} prosedur kepakaran — klik untuk baca.</div><div class="skgroup"><div class="sklist">';
  let n=0;
  for(const [cat,arr] of Object.entries(S.categories))for(const s of arr){
    if(n>=25)break;
    h+=`<div class="sk" onclick="openSkill('${esc(s.name)}')"><span class="sn">${esc(s.name)}</span><span class="sd">${esc(s.desc||'')}</span></div>`;n++;
  }
  h+=`</div></div>${S.total>25?'<div style="color:var(--faint);font-size:12.5px;padding:6px 12px">… dan '+(S.total-25)+' lagi — buka Skills untuk semua.</div>':''}</div>`;
  $('content').innerHTML=h;
}
function viewSkills(){
  setNav('skills'); $('t1').textContent='Skills'; $('t2').textContent='';
  $('sw').style.display='flex'; $('q').value=''; listSkills('');
}
function listSkills(q){
  q=q.trim().toLowerCase(); let h='',shown=0;
  for(const [cat,arr] of Object.entries(S.categories)){
    const f=arr.filter(s=>!q||s.name.toLowerCase().includes(q)||(s.desc||'').toLowerCase().includes(q));
    if(!f.length)continue;
    h+=`<div class="skgroup"><div class="skhead">${esc(cat.replace(/-/g,' '))} · ${f.length}</div>`;
    for(const s of f)h+=`<div class="sk" onclick="openSkill('${esc(s.name)}')"><span class="sn">${esc(s.name)}</span><span class="sd">${esc(s.desc||'')}</span></div>`,shown++;
    h+='</div>';
  }
  $('content').innerHTML=`<div class="pt">Skills</div><div class="pd">${shown} prosedur ditemui.</div>${h||'<div class="none">Tiada skill sepadan</div>'}`;
}
$('q').addEventListener('input',e=>listSkills(e.target.value));
function viewSoon(){ $('sw').style.display='none'; $('content').innerHTML='<div style="padding:60px 20px;text-align:center"><div style="font-size:40px;margin-bottom:14px">🚧</div><div style="font-weight:600;font-size:16px">Nanti dulu</div><div style="color:var(--faint);font-size:13px;margin-top:4px">Page ni akan datang — fokus Brain & Skills dulu.</div></div>'; }

/* detail */
async function openDoc(id){const f=B.files.find(x=>x.id===id);$('t1').textContent=f.name;$('t2').textContent='Brain';$('sw').style.display='none';
  $('content').innerHTML=`<div class="back" onclick="viewDocs()">← Brain</div><div class="dt">${esc(f.name)}</div><div class="ds2">${esc(f.desc)}</div><pre class="code" data-file="${esc(f.name)}">${esc(f.content)}</pre>`;}
async function openSkill(nm){$('t1').textContent=nm;$('t2').textContent='Skills';$('sw').style.display='none';
  $('content').innerHTML='<div style="color:var(--faint);padding:30px">Memuat…</div>';
  const d=await get('/api/skill?name='+encodeURIComponent(nm));
  $('content').innerHTML=`<div class="back" onclick="viewSkills()">← Skills</div><div class="dt">${esc(d.name)}</div><div class="ds2">SKILL.md</div><pre class="code" data-file="${esc(d.name)} · SKILL.md">${esc(d.content)}</pre>`;}

/* ===== Chat ===== */
let chatHist = [];
function viewChat(){
  setNav('chat'); $('t1').textContent='Chat'; $('t2').textContent='';
  $('sw').style.display='none';
  $('content').innerHTML = `
    <div class="chatwrap">
      <div class="chatbox" id="chatbox"></div>
      <div class="chatinput">
        <textarea id="chatTxt" placeholder="Tanya Ana apa-apa, atau bagi task…" rows="1"></textarea>
        <button id="chatSend">Hantar</button>
      </div>
    </div>`;
  const box = $('chatbox');
  for (const m of chatHist) addBubble(m.role, m.text);
  if (!chatHist.length) addBubble('ana', '👋 Hai! Ini Chat Ana — tanya apa-apa atau bagi task. (Prototaip — setiap mesej sesi baru, macam Telegram /new)');
  const ta = $('chatTxt'), btn = $('chatSend');
  const send = () => {
    const v = ta.value.trim(); if (!v) return;
    chatHist.push({role:'user', text:v});
    addBubble('user', v);
    ta.value=''; autoGrow();
    btn.disabled=true;
    addBubble('ana', '…', true);
    const typingEl = box.lastChild;
    fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({message:v})})
      .then(r=>r.json()).then(d=>{
        if (d.worker_id) pollChat(d.worker_id, typingEl);
        else { typingEl.remove(); addBubble('ana','Error: '+d.error); btn.disabled=false; }
      }).catch(e=>{ typingEl.remove(); addBubble('ana','Ralat sambungan: '+e); btn.disabled=false; });
  };
  btn.addEventListener('click', send);
  ta.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }});
  ta.addEventListener('input', autoGrow);
  function autoGrow(){ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,120)+'px'; }
  box.scrollTop = box.scrollHeight;
}
function addBubble(role, text, typing){
  const box = $('chatbox'); if (!box) return;
  const d = document.createElement('div');
  d.className = 'bubble ' + (role==='user' ? 'user' : 'ana') + (typing ? ' typing' : '');
  d.innerHTML = (role==='user' ? '' : '<div class="who">Ana</div>') + '<span></span>';
  d.lastChild.textContent = text;
  box.appendChild(d); box.scrollTop = box.scrollHeight;
  return d;
}
function pollChat(wid, typingEl, tries){
  tries = tries || 0;
  if (tries > 120) { typingEl.remove(); addBubble('ana','⏱️ Timeout menunggu jawapan.'); $('chatSend').disabled=false; return; }
  fetch('/api/chat/status?id='+wid).then(r=>r.json()).then(d=>{
    if (d.status==='done'){
      typingEl.remove();
      const out = cleanAnaOut(d.output || '(tiada output)');
      chatHist.push({role:'ana', text:out});
      addBubble('ana', out);
      $('chatSend').disabled=false;
    } else {
      setTimeout(()=>pollChat(wid, typingEl, tries+1), 1500);
    }
  }).catch(()=>setTimeout(()=>pollChat(wid, typingEl, tries+1), 2000));
}
function cleanAnaOut(s){
  // buang artifact hermes CLI: header, box border, ANSI, metadata
  s = s.replace(/\x1b\[[0-9;]*m/g, '');           // ANSI color codes
  s = s.replace(/[\u2500\u2502\u250c\u2510\u2514\u2518\u2550\u2551\u2552\u2554\u2555\u2556\u2557\u2559\u255a\u255b\u255c\u255d\u255e\u255f\u2560\u2561\u2562\u2563\u2564\u2565\u2566\u2567\u2568\u2569\u256a\u256b\u256c\u2574\u2575\u2576\u2577\u2578\u2579\u257a\u257b\u257c\u257d\u257e\u257f]/g, '');  // box drawing
  const lines = s.split('\n');
  const keep = [];
  for (let i=0;i<lines.length;i++){
    const t = lines[i].trim();
    if (!t) { keep.push(''); continue; }
    if (/^(Query:|Initializing agent|Resume this session|Session:|Title:|Duration:|Messages:|model=|provider=|hermes -c|hermes --resume|─{5,}|⚕)/i.test(t)) continue;
    // buang baris yang hanya box chars
    if (/^[─│╭╮╰╯\s]*$/.test(t)) continue;
    keep.push(t);
  }
  let out = keep.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  return out || '(Ana tak beri jawapan teks)';
}

/* ===== helpers asas (digunakan seluruh app) — tambahan utk Meta Ads/PM ===== */
function toDateStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtN(n){ return Number(n||0).toLocaleString('en-MY'); }
function fmtRM(n){ n = Number(n||0); return 'RM' + n.toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function pct(n){ n = Number(n||0); return (Math.round(n*100)/100).toFixed(2)+'%'; }
function actVal(actions, type){
  // sokong format list [{action_type,value}] ATAU dict {type:value} (tree Zernio guna dict)
  if (!actions) return 0;
  if (Array.isArray(actions)){
    const a = actions.find(x=>x.action_type===type);
    return a ? Number(a.value||0) : 0;
  }
  if (typeof actions === 'object'){
    // dict: mungkin {type: value} atau {type: {value}} — Zernio tree guna {type: value}
    const v = actions[type];
    if (v==null) return 0;
    return Number(typeof v==='object' ? (v.value||0) : v) || 0;
  }
  return 0;
}
function resOf(row){
  // "Results" = hasil ikut objective campaign. Utk lead-gen/messaging:
  // messaging_conversation_started (result utama) → fallback first_reply.
  // Kalau campaign punya action type lain (purchase/lead), guna ia.
  const acts = row && row.actions;
  if (!acts) return 0;
  const types = ['onsite_conversion.messaging_conversation_started_7d',
                 'onsite_conversion.messaging_first_reply',
                 'purchase','lead','onsite_conversion.lead',
                 'offsite_conversion.fb_pixel_purchase'];
  for (const t of types){
    const v = actVal(acts, t);
    if (v) return v;
  }
  // objective-aware: kalau row ada objective & actions list, cari conversion pertama
  return 0;
}
function actValDict(actions, type){
  return actVal(actions, type);
}

function computeTotals(d){
  const camps = (d.tree.campaigns)||[];
  const rows = (d.insights.data)||[];
  const T = {spend:0, impr:0, reach:0, clicks:0, linkClicks:0, results:0, freq:0};
  for (const r of rows){
    T.spend += Number(r.spend||0);
    T.impr += Number(r.impressions||0);
    T.reach += Number(r.reach||0);
    T.clicks += Number(r.clicks||0);
    T.linkClicks += Number(r.inline_link_clicks||0);
    T.results += resOf(r);
  }
  if (T.impr && T.reach) T.freq = T.impr/T.reach;
  return T;
}
function computeTotalsRows(rows){
  const T = {spend:0, impr:0, reach:0, clicks:0, linkClicks:0, results:0, freq:0};
  for (const r of rows){
    T.spend += Number(r.spend||0);
    T.impr += Number(r.impressions||0);
    T.reach += Number(r.reach||0);
    T.clicks += Number(r.clicks||0);

function wowCompareHtml(T, P, d){
  const mk=(lb,cur,prev,fmt,inv)=>{
    const chg = (prev!=null && prev!==0 && cur!=null) ? (cur-prev)/prev*100 : null;
    let badge='', arrow='';
    if (chg!=null){
      const good = inv ? chg<0 : chg>0; const bad = inv ? chg>0 : chg<0;
      if (chg>0.05||chg<-0.05){ arrow = chg>0?'▲':'▼'; }
      badge = '<span class="d '+(bad?'down':good?'up':'flat')+'" style="margin-left:4px">'+arrow+' '+Math.abs(chg).toFixed(1)+'%</span>';
    }
    return '<div style="flex:1;min-width:120px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px">'
      +'<div style="font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px">'+lb+'</div>'
      +'<div style="font-size:17px;font-weight:800;margin-top:2px">'+fmt(cur)+badge+'</div>'
      +'<div style="font-size:10.5px;color:var(--faint)">prev '+fmt(prev)+'</div></div>';
  };
  const cpr=T.results?T.spend/T.results:0, pcpr=P.results?P.spend/P.results:0;

/* ENGINE TUNGGAL — jana analisis dari data sebenar (BM, fakta sahaja) */
function buildWeeklyAnalysis(T, P, adsRows){
  const facts=[], obs=[], concl=[], take=[];
  facts.push(adsRows.length+' ad aktif dalam tempoh laporan.');
  facts.push('Jumlah spend '+fmtRM(T.spend)+'.');
  facts.push(fmtN(T.results)+' messaging conversations.');
  facts.push('Reach '+fmtN(T.reach)+' orang dan '+fmtN(T.impr)+' impressions.');
  const adRes = adsRows.map(r=>({name:r.ad_name, res:resOf(r)})).sort((a,b)=>b.res-a.res);
  if (adRes.length>1 && adRes[0] && adRes[0].res>0){
    const tot=adRes.reduce((s,a)=>s+a.res,0)||1;
    const share=adRes[0].res/tot*100;
    if (share>=50){
      obs.push('Satu creative menghasilkan majoriti messaging conversations ('+share.toFixed(0)+'%): "'+adRes[0].name+'".');
      concl.push('Prestasi kempen banyak tertumpu kepada satu creative utama.');
      take.push('Creative utama menyumbang majoriti hasil ('+share.toFixed(0)+'%).');
    }
  }
  const chgRes = (P && P.results)? ((T.results-P.results)/P.results*100) : null;
  if (chgRes!=null && Math.abs(chgRes)>=5){
    obs.push('Messaging conversations '+(chgRes>0?'naik':'turun')+' '+Math.abs(chgRes).toFixed(0)+'% berbanding tempoh sebelumnya.');
    take.push('Messaging conversations '+(chgRes>=0?'naik':'turun')+' vs tempoh sebelumnya.');
  }
  const cpr = T.results? T.spend/T.results:0;
  const pcpr = (P && P.results)? P.spend/P.results:0;
  if (cpr && pcpr){
    const dchg=(cpr-pcpr)/pcpr*100;
    if (Math.abs(dchg)>=5){
      obs.push('Cost per result '+(dchg>0?'naik':'turun')+' '+Math.abs(dchg).toFixed(0)+'% ('+fmtRM(cpr)+' vs '+fmtRM(pcpr)+').');
      take.push('Cost per result '+(cpr<pcpr?'makin murah':'naik')+' — '+fmtRM(cpr)+'.');
    }
  }
  if (!obs.length) obs.push('Tiada perubahan melebihi 5% dikesan berbanding tempoh sebelumnya.');
  if (!concl.length) concl.push('Data tidak menunjukkan punca yang jelas untuk satu creative tertentu.');
  if (!take.length) take.push('Kempen berjalan pada tahap biasa dalam tempoh ini.');
  return {facts: facts, observations: obs, conclusions: concl, keyTakeaways: take};
}

/* ===== METRIC MAPPING (Requirement 5) — satu sumber per metric ===== */
const TREND_METRICS = {
  spend:   { label: 'Amount Spent', axis: v => fmtRM(v),                       tip: v => fmtRM(v) },
  results: { label: 'Results',      axis: v => Math.round(v).toLocaleString(), tip: v => Math.round(v).toLocaleString() },
  impr:    { label: 'Impressions',  axis: v => Math.round(v).toLocaleString(), tip: v => Math.round(v).toLocaleString() },
  reach:   { label: 'Reach',        axis: v => Math.round(v).toLocaleString(), tip: v => Math.round(v).toLocaleString() },
  cpm:     { label: 'CPM',          axis: v => fmtRM(v),                       tip: v => fmtRM(v) },
  ctr:     { label: 'CTR (all)',    axis: v => v.toFixed(1) + '%',             tip: v => v.toFixed(2) + '%' }
};
function trendMetricValue(day, metric){
  switch (metric){
    case 'spend':   return Number(day.spend || 0);
    case 'results': return day.results || 0;                    // ← normalized Results (sama mcm KPI/WoW/hierarchy)
    case 'impr':    return Number(day.impressions || 0);
    case 'reach':   return Number(day.reach || 0);
    case 'cpm':     return day.impressions ? (Number(day.spend||0) / Number(day.impressions) * 1000) : 0;
    case 'ctr':     return day.impressions ? (Number(day.clicks||0) / Number(day.impressions) * 100) : 0;
    default:        return Number(day.spend || 0);
  }
}
/* Bina series harian: aggregate + continuous (hari kosong = 0) */
function buildDailySeries(d){
  const di = (d.daily_insights && d.daily_insights.data) || [];
  const byDay = {};
  for (const r of di){
    const k = String(r.date_start || r.date || '').slice(0, 10);
    if (!k) continue;
    if (!byDay[k]) byDay[k] = { date_start: k, spend: 0, impressions: 0, clicks: 0, reach: 0, linkClicks: 0, results: 0 };
    const b = byDay[k];
    b.spend += Number(r.spend || 0);
    b.impressions += Number(r.impressions || 0);
    b.clicks += Number(r.clicks || 0);
    b.reach += Number(r.reach || 0);
    b.linkClicks += Number(r.inline_link_clicks || 0);
    b.results += resOf(r);       // ← SUMBER SAMA dgn KPI/WoW/hierarchy (messaging_conversation_started)
  }
  // continuous daily series ikut selected date range (Requirement 4 — jangan buang hari 0)
  const from = d.from, to = d.to;
  if (from && to){
    const out = []; let cur = new Date(from + 'T00:00:00'); const end = new Date(to + 'T00:00:00');
    let guard = 0;
    while (cur <= end && guard < 400){
      const k = cur.getFullYear() + '-' + String(cur.getMonth()+1).padStart(2,'0') + '-' + String(cur.getDate()).padStart(2,'0');
      out.push(byDay[k] || { date_start: k, spend: 0, impressions: 0, clicks: 0, reach: 0, linkClicks: 0, results: 0 });
      cur.setDate(cur.getDate() + 1); guard++;
    }
    if (out.length) return out;
  }
  return Object.values(byDay).sort((a,b) => a.date_start.localeCompare(b.date_start));
}
function drawTrend(d){
  const svg = $('trendChart'); if (!svg) return;
  const daily = buildDailySeries(d);
  if (!daily.length){ svg.innerHTML='<text x="300" y="95" text-anchor="middle" fill="#9ca3af" font-size="12">Tiada data harian</text>'; return; }
  const metric = metaTrendMetric || 'spend';
  const MM = TREND_METRICS[metric] || TREND_METRICS.spend;
  const vals = daily.map(x => trendMetricValue(x, metric));
  // Requirement 7 — validate: SUM(daily) mesti == total period (utk Results)
  if (metric === 'results'){
    const totalRes = computeTotals(d).results || 0;
    const sumRes = vals.reduce((s,v)=>s+v, 0);
    if (totalRes > 0 && sumRes !== totalRes){
      console.warn('[Trend] Results mismatch — daily SUM=' + sumRes + ' vs total=' + totalRes + ' (semak mapping)');
    }
  }
  const W=600,H=190,padL=52,padR=12,padT=16,padB=28;
  const iw=W-padL-padR, ih=H-padT-padB;
  const maxV = Math.max(...vals, 1) * 1.15;
  svg.innerHTML='';
  const ns='http://www.w3.org/2000/svg';
  const mk=(tag,at)=>{const e=document.createElementNS(ns,tag);for(const k in at)e.setAttribute(k,at[k]);return e;};
  for(let g=0;g<=3;g++){const y=padT+ih-g*ih/3;svg.appendChild(mk('line',{x1:padL,y1:y,x2:W-padR,y2:y,stroke:'#f0edea','stroke-width':1}));const tx=mk('text',{x:padL-6,y:y+4,'text-anchor':'end','font-size':9.5,fill:'#9ca3af'});tx.textContent=MM.axis(maxV*g/3);svg.appendChild(tx);}
  const step=iw/Math.max(daily.length-1,1);
  const bw=Math.min(30, step*0.5);
  daily.forEach((x,i)=>{
    const v=trendMetricValue(x, metric); const cx=padL+i*step, bx=cx-bw/2;
    const hh= v>0 ? Math.max(v/maxV*ih, 2) : 0;
    if (hh>0) svg.appendChild(mk('rect',{x:bx,y:padT+ih-hh,width:bw,height:hh,fill:'#f97316',rx:3,opacity:.9}));
    const tx=mk('text',{x:cx,y:H-7,'text-anchor':'middle','font-size':8.5,fill:'#9ca3af'});tx.textContent=(x.date_start||'').slice(5);svg.appendChild(tx);
    const vl=mk('text',{x:cx,y:padT+ih-hh-4,'text-anchor':'middle','font-size':8.5,'font-weight':'700',fill:'#4b5563'});vl.textContent=MM.tip(v);svg.appendChild(vl);
  });
  if(daily.length>1){let pl='';daily.forEach((x,i)=>{const v=trendMetricValue(x,metric),cx=padL+i*step;pl+=(i?',':'')+cx+','+(padT+ih-(v/maxV)*ih);});svg.appendChild(mk('polyline',{points:pl,fill:'none',stroke:'#c2410c','stroke-width':1.4}));}
  const cap=mk('text',{x:padL,y:11,'font-size':9.5,fill:'#6b7280'});cap.textContent=MM.label;svg.appendChild(cap);
}

}

function rateDelta(curR,prevR,inv){

  const mk=(tag,at)=>{const e=document.createElementNS(ns,tag);for(const k in at)e.setAttribute(k,at[k]);return e;};
  for(let g=0;g<=3;g++){const y=padT+ih-g*ih/3;svg.appendChild(mk('line',{x1:padL,y1:y,x2:W-padR,y2:y,stroke:'#e5e7eb','stroke-width':1}));const tx=mk('text',{x:padL-6,y:y+4,'text-anchor':'end','font-size':10,fill:'#9ca3af'});tx.textContent='RM'+Math.round(maxV*g/3);svg.appendChild(tx);}
  const step=iw/Math.max(arr.length-1,1);
  const bw=Math.min(38,step*0.55);
  arr.forEach((x,i)=>{
    const cx=padL+i*step, bx=cx-bw/2;
    const hh=Math.max((x.spend/maxV)*ih,2);
    svg.appendChild(mk('rect',{x:bx,y:padT+ih-hh,width:bw,height:hh,fill:'#f97316',rx:4}));
    const lb=mk('text',{x:cx,y:H-6,'text-anchor':'middle','font-size':9,fill:'#9ca3af'});lb.textContent=x.label||x.d.slice(5);svg.appendChild(lb);
    const vl=mk('text',{x:cx,y:padT+ih-hh-5,'text-anchor':'middle','font-size':9,fill:'#6b7280'});vl.textContent=Math.round(x.spend);svg.appendChild(vl);
  });
  if(arr.length>1){let pl='';arr.forEach((x,i)=>{const cx=padL+i*step;pl+=(i?',':'')+cx+','+(padT+ih-(x.spend/maxV)*ih);});svg.appendChild(mk('polyline',{points:pl,fill:'none',stroke:'#c2410c','stroke-width':1.6}));}
  const cap=mk('text',{x:padL,y:12,'font-size':10,fill:'#6b7280'});cap.textContent='Ad Spend harian (RM) — revenue line akan muncul bila integrasi wujud';svg.appendChild(cap);
}
/* ===== Alerts (current vs prev, threshold 10%) ===== */
function renderPMAlerts(C,P){
  const el=$('pmAlerts');if(!el)return;
  let A=[];
  const ctrAll=C.impr?C.clicks/C.impr*100:0, pCtr=P.impr?P.clicks/P.impr*100:0;
  const chgCtr=pctChg(ctrAll,pCtr);
  if(chgCtr!=null&&chgCtr<-10)A.push({s:'yellow',t:'CTR menurun',ev:'CTR '+ctrAll.toFixed(2)+'% vs '+pCtr.toFixed(2)+'% ('+chgCtr.toFixed(1)+'%)'});
  if(chgCtr!=null&&chgCtr>10)A.push({s:'green',t:'CTR meningkat',ev:'CTR '+ctrAll.toFixed(2)+'% vs '+pCtr.toFixed(2)+'% (+'+chgCtr.toFixed(1)+'%)'});
  const cpl=C.wa?C.spend/C.wa:null, pcpl=P.wa?P.spend/P.wa:null;
  const chgCpl=pctChg(cpl,pcpl);
  if(chgCpl!=null&&chgCpl>10)A.push({s:'yellow',t:'CPL naik',ev:'CPL '+fmtRMC(cpl)+' vs '+fmtRMC(pcpl)+' (+'+chgCpl.toFixed(1)+'%)'});
  if(chgCpl!=null&&chgCpl<-10)A.push({s:'green',t:'CPL turun',ev:'CPL '+fmtRMC(cpl)+' vs '+fmtRMC(pcpl)+' ('+chgCpl.toFixed(1)+'%)'});
  const chgSp=pctChg(C.spend,P.spend), chgWa=pctChg(C.wa,P.wa);
  if(chgSp!=null&&chgWa!=null&&chgSp>5&&chgWa<-5)A.push({s:'red',t:'Spend naik tapi hasil turun',ev:'Spend +'+chgSp.toFixed(0)+'% · WA '+chgWa.toFixed(0)+'% — efficiency jatuh'});
  if(chgWa!=null&&chgWa>15)A.push({s:'green',t:'WA results meningkat',ev:'+'+chgWa.toFixed(0)+'% vs previous period'});
  if(chgWa!=null&&chgWa<-15)A.push({s:'yellow',t:'WA results menurun',ev:chgWa.toFixed(0)+'% vs previous period — needs investigation'});
  const cpm=C.impr?C.spend/C.impr*1000:0, pCpm=P.impr?P.spend/P.impr*1000:0;
  const chgCpm=pctChg(cpm,pCpm);
  if(chgCpm!=null&&chgCpm>15)A.push({s:'yellow',t:'CPM naik',ev:'CPM '+fmtRMC(cpm)+' vs '+fmtRMC(pCpm)+' (+'+chgCpm.toFixed(1)+'%) — traffic makin mahal?'});
  const freq=C.impr&&C.reach?C.impr/C.reach:0, pFreq=P.impr&&P.reach?P.impr/P.reach:0;
  const chgF=pctChg(freq,pFreq);
  if(chgF!=null&&chgF>20&&freq>3)A.push({s:'yellow',t:'Frequency tinggi & naik',ev:'Freq '+freq.toFixed(2)+'x vs '+pFreq.toFixed(2)+'x (+'+chgF.toFixed(0)+'%) — possible creative fatigue'});
  if(!A.length)A.push({s:'green',t:'Tiada isu melebihi ambang',ev:'Semua metrik dalam julat ±10% (CPL/CTR/hasil) — pantau seperti biasa'});
  let h='';
  for(const a of A){h+='<div class="insight-card alert-'+a.s+'"><div style="font-weight:800;font-size:13px">'+(a.s==='red'?'🔴':a.s==='yellow'?'🟡':'🟢')+' '+esc(a.t)+'</div><div style="font-size:12px;color:var(--dim);margin-top:3px">Evidence: '+esc(a.ev)+'</div></div>';}
  el.innerHTML=h;
}
/* ===== Insights: ISSUE → EVIDENCE → DIAGNOSIS → ACTION → KPI ===== */
function renderPMInsights(C,P){
  const el=$('pmInsights');if(!el)return;
  const rows=(pmData.current||{}).data||[];
  const ctrAll=C.impr?C.clicks/C.impr*100:0, pCtr=P.impr?P.clicks/P.impr*100:0;
  const chgCtr=pctChg(ctrAll,pCtr);
  const cpl=C.wa?C.spend/C.wa:null, pcpl=P.wa?P.spend/P.wa:null;
  const chgCpl=pctChg(cpl,pcpl);
  const chgWa=pctChg(C.wa,P.wa);
  const freq=C.impr&&C.reach?C.impr/C.reach:0;
  let h='';
  const ic=(issue,sev,ev,diag,act,kpi)=>{
    h+='<div class="insight-card" style="border-left:4px solid '+(sev==='red'?'#dc2626':sev==='yellow'?'#d97706':'#059669')+'">'
      +'<div style="font-weight:800;font-size:13px">'+(sev==='red'?'🔴':sev==='yellow'?'🟡':'🟢')+' '+esc(issue)+'</div>'
      +'<div style="font-size:12px;color:var(--dim);margin-top:5px"><b>🔎 Evidence:</b> '+esc(ev)+'</div>'
      +'<div style="font-size:12px;color:var(--dim);margin-top:2px"><b>🧠 Possible diagnosis:</b> '+esc(diag)+'</div>'
      +'<div style="font-size:12px;color:var(--dim);margin-top:2px"><b>🛠 Recommended action:</b> '+esc(act)+'</div>'
      +'<div style="font-size:12px;color:var(--dim);margin-top:2px"><b>🎯 KPI to monitor:</b> '+kpi+'</div>'
      +'</div>';
  };
  /* winning creative */
  let best=null;for(const r of rows){let w=0;for(const ac of(r.actions||[])){if((ac.action_type||'').includes('messaging_conversation'))w+=+ac.value||0;}if(!best||w>(best.wa||0))best={name:r.ad_name,wa:w,spend:+r.spend||0};}
  if(best&&best.wa>0){
    ic('Winning creative: '+best.name,'green',
       best.wa+' WhatsApp results · spend '+fmtRMC(best.spend)+(cpl?(' · CPL '+fmtRMC(best.wa?best.spend/best.wa:null)):''),
       'Creative ini paling cekap tukar spend → hasil (data kukuh: hasil sebenar).',
       'Pertimbang tambah budget / clone angle + hook video ini untuk variasi baru. Jika scale, pantau CPL — jangan biar naik >10%.',
       'CPL creative · frequency · CTR link');
  }
  if(chgCtr!=null&&chgCtr<-10){
    ic('CTR link menurun','yellow',
       'CTR link '+ctrL()+ '% vs '+pCtrL()+'%'+(freq?(' · frequency kini '+freq.toFixed(2)+'x'):''),
       'Possible creative fatigue atau audience saturation (perlu data placement/audience untuk sahkan). BUKAN root cause muktamad.',
       'Semak: (1) frequency per ad — tinggi? (2) placement mana CTR jatuh? (3) creative dah lama tayang? Kemudian test variasi baru.',
       'CTR link · frequency · CPL');
  } else if(chgWa!=null&&chgWa<-15){
    ic('WhatsApp results menurun','yellow',
       'WA '+C.wa+' vs '+P.wa+' ('+chgWa.toFixed(0)+'%)',
       'Possible cause: kreatif letih, audience kehabisan, atau supply/placement berubah. Needs investigation — tak cukup data untuk sahkan.',
       'BandCompare iklan per iklan: ad mana yang jatuh? Semak frequency + CPM. Tweak/buat creative baru untuk ad yang fatigue.',
       'WA results · CPL · frequency');
  } else if(chgCtr==null||Math.abs(chgCtr||0)<=10){
    if(chgCpl!=null&&chgCpl<-10)
      ic('Efficiency membaik','green',
         'CPL '+fmtRMC(cpl)+' vs '+fmtRMC(pcpl)+' ('+chgCpl.toFixed(1)+'%)',
         'Traffic makin cekap — positive signal.',
         'Ini masa sesuai untuk scale (naikkan budget perlahan 10-20%) sambil pantau CPL kekal stabil.',
         'CPL · WA results · spend');
    else
      ic('Performance stabil','green',
         'Tiada metrik jatuh melebihi ambang 10% (CTR/CPL/hasil).',
         'Kempen berjalan dalam julat normal.',
         'Teruskan. Fokus: tingkatkan hasil — test creative baru berdasarkan winning angle, atau tambah audience.',
         'Semua KPI utama');
  }
  /* root-cause logic: di mana funnel bocor */
  h+='<div class="insight-card"><div style="font-weight:800;font-size:13px">🧭 Funnel Diagnostics — di mana nak lihat?</div>'
    +'<table class="tbl" style="margin-top:6px"><tr><th>Jika stage ini bocor</th><th>Check seterusnya</th></tr>'
    +'<tr><td>Impressions → Clicks (CTR ↓)</td><td>Creative relevan? Audience betul? Offer jelas? Placement?</td></tr>'
    +'<tr><td>Clicks → WhatsApp (conv ↓)</td><td>CTA jelas? Landing/WA link berfungsi? Traffic quality?</td></tr>'
    +'<tr><td>WA → Qualified (lead quality ↓)</td><td>Messaging iklan janji tepat? Audience sesuai? (perlu CRM)</td></tr>'
    +'<tr><td>Qualified → Purchase (close rate ↓)</td><td>Follow-up laju? Harga/offer? Trust? (perlu sales data)</td></tr>'
    +'</table></div>';
  /* data gap */
  h+='<div class="insight-card"><div style="font-weight:800;font-size:13px">📌 Data gap — untuk keputusan penuh</div>'
    +'<div style="font-size:12px;color:var(--dim);margin-top:4px">Revenue/ROAS/profit tak boleh dikira tanpa integrasi sales (CRM/Shopify). Untuk JFR Auto: sambungkan <b>WhatsApp sales tracking</b> (lead → qualified → jual) supaya funnel penuh & CPA sebenar muncul. Untuk Dians Signature: sambung <b>Shopify/GA4</b> — pixel events (view, ATC, checkout, purchase) akan hidupkan funnel e-commerce secara automatik.</div></div>';
  el.innerHTML=h;
}
function ctrL(){const d=pmData;if(!d)return'—';const C=pmAgg((d.current||{}).data||[]);return C.impr?(C.link/C.impr*100).toFixed(2):'—';}
function pCtrL(){const d=pmData;if(!d)return'—';const P=pmAgg((d.previous||{}).data||[]);return P.impr?(P.link/P.impr*100).toFixed(2):'—';}
/* ===== Campaign table (sortable) ===== */
function renderPMCamps(rows){
  const el=$('pmCampTable');if(!el)return;
  const camps={};
  for(const r of rows){const k=r.campaign_name||'(none)';if(!camps[k])camps[k]={spend:0,impr:0,clicks:0,link:0,wa:0,reach:0};const c=camps[k];c.spend+=+r.spend||0;c.impr+=+r.impressions||0;c.clicks+=+r.clicks||0;c.link+=+r.inline_link_clicks||0;c.reach+=+r.reach||0;
    for(const ac of(r.actions||[])){if((ac.action_type||'').includes('messaging_conversation'))c.wa+=+ac.value||0;}}
  let arr=Object.entries(camps).map(([k,c])=>({name:k,...c,cpl:c.wa?c.spend/c.wa:null,ctr:c.impr?c.link/c.impr*100:0,cpc:c.link?c.spend/c.link:null}));
  const key=pmSort||'spend';
  arr.sort((a,b)=>key==='cpl'?((a.cpl??1e9)-(b.cpl??1e9)):((b[key]||0)-(a[key]||0)));
  let h='<table class="tbl"><tr><th>Campaign</th><th class="num">Spend</th><th class="num">Impr</th><th class="num">CTR lnk</th><th class="num">CPC lnk</th><th class="num">WA</th><th class="num">CPL</th><th class="num">CPM</th><th class="num">Revenue</th><th class="num">ROAS</th><th>Verdict</th></tr>';
  for(const c of arr){
    let v='<span style="font-size:11px;color:var(--faint)">—</span>';
    if(c.wa>0&&c.cpl){v=c.cpl<5?'<span style="color:#047857;font-weight:700">SCALE 🟢</span>':c.cpl<10?'<span style="color:#d97706">Monitor 🟡</span>':'<span style="color:#b91c1c">Investigate 🔴</span>';}
    h+='<tr><td><b>'+esc(c.name)+'</b></td><td class="num">'+fmtRMC(c.spend)+'</td><td class="num">'+fmtN(c.impr)+'</td><td class="num">'+c.ctr.toFixed(2)+'%</td><td class="num">'+(c.cpc?fmtRMC(c.cpc):'—')+'</td><td class="num">'+fmtN(c.wa)+'</td><td class="num">'+(c.cpl!=null?fmtRMC(c.cpl):'—')+'</td><td class="num">'+(c.impr?fmtRMC(c.spend/c.impr*1000):'—')+'</td><td class="num na-tag">N/A</td><td class="num na-tag">N/A</td><td>'+v+'</td></tr>';
  }
  if(!arr.length)h+='<tr><td colspan="11" class="na-tag">Tiada data</td></tr>';
  h+='</table>';
  h+='<div style="font-size:11px;color:var(--faint);padding:6px 2px">Verdict sementara: SCALE = CPL &lt; RM5 · Monitor = RM5-10 · Investigate = &gt; RM10. Revenue/ROAS akan hidup bila sales data disambung.</div>';
  el.innerHTML=h;
}
function pmCampSort(k){pmSort=k;renderPMCamps((pmData.current||{}).data||[]);document.querySelectorAll('#pmCampTable ~ * , .sortbtn').forEach(()=>{});document.querySelectorAll('.pmsec .sortbtn').forEach(b=>{});}
/* ===== Ad set table ===== */
function renderPMAdsets(rows){
  const el=$('pmAdsetTable');if(!el)return;
  const m={};
  for(const r of rows){const k=r.adset_name||'(none)';if(!m[k])m[k]={spend:0,wa:0,clicks:0,impr:0,reach:0,link:0};const a=m[k];a.spend+=+r.spend||0;a.clicks+=+r.clicks||0;a.impr+=+r.impressions||0;a.reach+=+r.reach||0;a.link+=+r.inline_link_clicks||0;
    for(const ac of(r.actions||[])){if((ac.action_type||'').includes('messaging_conversation'))a.wa+=+ac.value||0;}}
  let h='<table class="tbl"><tr><th>Ad Set / Audience</th><th class="num">Spend</th><th class="num">CTR lnk</th><th class="num">CPC lnk</th><th class="num">WA</th><th class="num">CPL</th><th class="num">Freq</th><th>Signal</th></tr>';
  for(const [k,a] of Object.entries(m)){
    const ctr=a.impr?a.link/a.impr*100:0, cpl=a.wa?a.spend/a.wa:null, freq=a.reach?a.impr/a.reach:0;
    let sig='<span style="font-size:11px;color:var(--faint)">—</span>';
    if(freq>3&&ctr<1.5)sig='<span style="font-size:11px;color:#d97706">Possible fatigue (freq '+freq.toFixed(1)+'x, CTR rendah)</span>';
    else if(cpl!=null&&cpl<5)sig='<span style="font-size:11px;color:#047857">Cekap — scaling potential</span>';
    h+='<tr><td><b>'+esc(k)+'</b></td><td class="num">'+fmtRMC(a.spend)+'</td><td class="num">'+ctr.toFixed(2)+'%</td><td class="num">'+(a.link?fmtRMC(a.spend/a.link):'—')+'</td><td class="num">'+fmtN(a.wa)+'</td><td class="num">'+(cpl!=null?fmtRMC(cpl):'—')+'</td><td class="num">'+freq.toFixed(2)+'x</td><td>'+sig+'</td></tr>';
  }
  if(!Object.keys(m).length)h+='<tr><td colspan="8" class="na-tag">Tiada data</td></tr>';
  el.innerHTML=h;
}
/* ===== Creative table ===== */
function renderPMCreatives(rows){
  const el=$('pmCreativeTable');if(!el)return;
  let h='<table class="tbl"><tr><th>Creative (Ad)</th><th class="num">Spend</th><th class="num">Impr</th><th class="num">Freq</th><th class="num">CTR lnk</th><th class="num">CPC lnk</th><th class="num">WA</th><th class="num">CPL</th><th class="num">% WA</th><th>Status</th></tr>';
  const tot=C=>{const d=pmData;if(!d)return 1;const a=pmAgg((d.current||{}).data||[]);return a.wa||1;};
  const totalWa=tot();
  [...rows].sort((a,b)=>{let wa=0,wb=0;for(const ac of(a.actions||[])){if((ac.action_type||'').includes('messaging_conversation'))wa+=+ac.value||0;}for(const ac of(b.actions||[])){if((ac.action_type||'').includes('messaging_conversation'))wb+=+ac.value||0;}return wb-wa;}).forEach(r=>{
    let wav=0;for(const ac of(r.actions||[])){if((ac.action_type||'').includes('messaging_conversation'))wav+=+ac.value||0;}
    const sp=+r.spend||0, imp=+r.impressions||0, lnk=+r.inline_link_clicks||0, reach=+r.reach||0;
    const ctr=imp?lnk/imp*100:0, cpc=lnk?sp/lnk:null, cpl=wav?sp/wav:null, freq=reach?imp/reach:0;
    let status='<span style="font-size:11px;color:var(--faint)">warming</span>';
    if(wav>0&&cpl!=null){status=cpl<5?'<span style="color:#047857;font-weight:700">WINNING 🏆</span>':cpl<10?'<span style="color:#d97706">monitor</span>':'<span style="color:#b91c1c">losing</span>';}
    if(freq>3.5&&ctr<1)status='<span style="color:#d97706">possible fatigue</span>';
    h+='<tr><td>'+esc(r.ad_name||'?')+'</td><td class="num">'+fmtRMC(sp)+'</td><td class="num">'+fmtN(imp)+'</td><td class="num">'+(freq?freq.toFixed(2)+'x':'—')+'</td><td class="num">'+ctr.toFixed(2)+'%</td><td class="num">'+(cpc?fmtRMC(cpc):'—')+'</td><td class="num">'+fmtN(wav)+'</td><td class="num">'+(cpl?fmtRMC(cpl):'—')+'</td><td class="num">'+(wav/totalWa*100).toFixed(1)+'%</td><td>'+status+'</td></tr>';
  });
  if(!rows.length)h+='<tr><td colspan="10" class="na-tag">Tiada data</td></tr>';
  h+='</table>';
  h+='<div style="font-size:11px;color:var(--faint);padding:6px 2px">Status: WINNING = CPL &lt; RM5 · losing = &gt; RM10 · possible fatigue = freq &gt; 3.5x dengan CTR link &lt; 1%. Metadata creative (hook/angle/creator) — N/A, belum diisi.</div>';
  el.innerHTML=h;
}
/* mascot drag + status */
(function(){const m=$('mascot');let on=false,ox=0,oy=0;
  m.addEventListener('mousedown',e=>{on=true;ox=e.clientX-m.getBoundingClientRect().left;oy=e.clientY-m.getBoundingClientRect().top;e.preventDefault();});
  document.addEventListener('mousemove',e=>{if(!on)return;m.style.left=Math.min(Math.max(0,e.clientX-ox),innerWidth-68)+'px';m.style.top=Math.min(Math.max(0,e.clientY-oy),innerHeight-68)+'px';m.style.right='auto';m.style.bottom='auto';});
  document.addEventListener('mouseup',()=>on=false);})();
